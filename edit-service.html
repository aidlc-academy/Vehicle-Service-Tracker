<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Service Record — Vehicle Service Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="overlay" id="overlay"></div>

  <!-- ══════════════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════════════ -->
  <header class="header">
    <a class="header__logo" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 6h8l2 5H6L8 6zM3 11h18v4H3v-4zm3 4v2m12-2v2"/>
        <circle cx="6.5" cy="17.5" r="1.5"/>
        <circle cx="17.5" cy="17.5" r="1.5"/>
      </svg>
      Service<span>Tracker</span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </header>

  <!-- ══════════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════════ -->
  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <p class="nav__label">Menu</p>

    <a class="nav__link" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
    </a>

    <a class="nav__link" href="vehicles.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 6h8l2 5H6L8 6zM3 11h18v4H3v-4zm3 4v2m12-2v2"/>
        <circle cx="6.5" cy="17.5" r="1.5"/>
        <circle cx="17.5" cy="17.5" r="1.5"/>
      </svg>
      My Vehicles
    </a>

    <a class="nav__link" href="add-vehicle.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/>
        <path stroke-linecap="round" d="M12 8v8M8 12h8"/>
      </svg>
      Add Vehicle
    </a>
  </nav>

  <!-- ══════════════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════════════ -->
  <main class="main">

    <div id="alertContainer"></div>

    <!-- Breadcrumb -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Dashboard</a>
      <span class="sep">›</span>
      <a href="vehicles.html">My Vehicles</a>
      <span class="sep">›</span>
      <span id="crumbVehicleName">Vehicle</span>
      <span class="sep">›</span>
      <span>Edit Service Record</span>
    </nav>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <h1>Edit Service Record</h1>
        <p>Update the service record details below.</p>
      </div>
    </div>

    <!-- ── Enhanced form card ── -->
    <div class="form-card service-form">
      <form id="editServiceForm" novalidate>

        <!-- Service Type & Date -->
        <div class="form-row">
          <div class="form-group">
            <label for="serviceType">Service Type <span class="required">*</span></label>
            <select id="serviceType" name="serviceType" required>
              <option value="">Select service type...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="serviceDate">Service Date <span class="required">*</span></label>
            <input type="date" id="serviceDate" name="serviceDate" required />
          </div>
        </div>

        <!-- Odometer Reading & Service Center -->
        <div class="form-row">
          <div class="form-group">
            <label for="odometerReading">Odometer Reading (km)</label>
            <input type="number" id="odometerReading" name="odometerReading"
                   placeholder="e.g. 45000" min="0" />
          </div>
          <div class="form-group">
            <label for="serviceCenter">Service Center / Mechanic</label>
            <input type="text" id="serviceCenter" name="serviceCenter"
                   placeholder="e.g. QuickLube Downtown"
                   maxlength="100" />
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="description">Service Description</label>
          <textarea id="description" name="description"
                    placeholder="Describe what work was performed..."
                    maxlength="500" rows="3"></textarea>
        </div>

        <!-- Parts Replaced -->
        <div class="form-group">
          <label for="partsReplaced">Parts Replaced</label>
          <textarea id="partsReplaced" name="partsReplaced"
                    placeholder="List any parts that were replaced..."
                    maxlength="300" rows="2"></textarea>
        </div>

        <!-- Costs -->
        <div class="form-row">
          <div class="form-group">
            <label for="laborCost">Labor Cost ($)</label>
            <input type="number" id="laborCost" name="laborCost"
                   placeholder="0.00" min="0" step="0.01" />
          </div>
          <div class="form-group">
            <label for="partsCost">Parts Cost ($)</label>
            <input type="number" id="partsCost" name="partsCost"
                   placeholder="0.00" min="0" step="0.01" />
          </div>
        </div>

        <!-- Total Cost (readonly, calculated) -->
        <div class="form-group">
          <label for="totalCost">Total Cost ($)</label>
          <input type="text" id="totalCost" name="totalCost"
                 readonly class="readonly" placeholder="0.00" />
          <span class="form-hint">Automatically calculated: Labor Cost + Parts Cost</span>
        </div>

        <!-- Next Service -->
        <div class="form-row">
          <div class="form-group">
            <label for="nextServiceDate">Next Service Date</label>
            <input type="date" id="nextServiceDate" name="nextServiceDate" />
          </div>
          <div class="form-group">
            <label for="nextServiceKM">Next Service KM</label>
            <input type="number" id="nextServiceKM" name="nextServiceKM"
                   placeholder="e.g. 50000" min="0" />
          </div>
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label for="notes">Additional Notes</label>
          <textarea id="notes" name="notes"
                    placeholder="Any additional notes about this service..."
                    maxlength="500" rows="3"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            Update Service Record
          </button>
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
        </div>

      </form>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/edit-service.js"></script>

</body>
</html>
