<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Vehicles — Vehicle Service Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="overlay" id="overlay"></div>

  <!-- ══════════════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════════════ -->
  <header class="header">
    <a class="header__logo" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 6h8l2 5H6L8 6zM3 11h18v4H3v-4zm3 4v2m12-2v2"/>
        <circle cx="6.5" cy="17.5" r="1.5"/>
        <circle cx="17.5" cy="17.5" r="1.5"/>
      </svg>
      Service<span>Tracker</span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </header>

  <!-- ══════════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════════ -->
  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <p class="nav__label">Menu</p>

    <a class="nav__link" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Dashboard
    </a>

    <a class="nav__link" href="vehicles.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 6h8l2 5H6L8 6zM3 11h18v4H3v-4zm3 4v2m12-2v2"/>
        <circle cx="6.5" cy="17.5" r="1.5"/>
        <circle cx="17.5" cy="17.5" r="1.5"/>
      </svg>
      My Vehicles
    </a>

    <a class="nav__link" href="add-vehicle.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/>
        <path stroke-linecap="round" d="M12 8v8M8 12h8"/>
      </svg>
      Add Vehicle
    </a>
  </nav>

  <!-- ══════════════════════════════════════════════════
       MAIN CONTENT
  ══════════════════════════════════════════════════ -->
  <main class="main">

    <div id="alertContainer"></div>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <h1>
          My Vehicles
          <span class="badge badge-blue" id="vehicleCount" style="font-size:.75rem;vertical-align:middle;">0</span>
        </h1>
        <p>Click a vehicle to view its details and service history.</p>
      </div>
      <a href="add-vehicle.html" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
        </svg>
        Add Vehicle
      </a>
    </div>

    <!-- Vehicle grid (populated by vehicles.js) -->
    <div class="vehicle-grid" id="vehicleGrid">
      <!-- Cards injected here by vehicles.js -->
    </div>

    <!-- Empty state (hidden when there are vehicles) -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M8 6h8l2 5H6L8 6zM3 11h18v4H3v-4zm3 4v2m12-2v2"/>
        <circle cx="6.5" cy="17.5" r="1.5"/>
        <circle cx="17.5" cy="17.5" r="1.5"/>
      </svg>
      <h3>No vehicles yet</h3>
      <p>Add your first vehicle to start tracking its service history.</p>
      <a href="add-vehicle.html" class="btn btn-primary" style="margin-top:1rem;">
        Add Your First Vehicle
      </a>
    </div>

  </main>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/vehicles.js"></script>

</body>
</html>
